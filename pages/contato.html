<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desculpas Express | Sobre nós</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Desculpas Express</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="./servicos.html">Nossos serviços</a></li>
                    <li class="nav-item"><a class="nav-link active" href="./sobre.html">Sobre nós</a></li>
                    <li class="nav-item"><a class="nav-link" href="./contato.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

        <header class="container text-center my-5">
        <h1>Entre em contato!</h1>
        <p>Tem alguma dúvida, sugestão ou reclamação? Estamos aqui para ouvir você!</p>
    </header>

    <main class="container my-5">
    <div class="row g-5">

        <div class="col-md-6">
            <h2>Envie sua mensagem</h2>

        <form>
            <div class="mb-3" >
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text" class="form-control" id="nome" placeholder="Digite seu nome..." minlength="3" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail..." required>
            </div>

            <div class="mb-3">
                <label for="assunto" class="form-label">Assunto - selecione</label>
                <select class="form-control" name="assunto" id="assunto" required>
                    <option value="duvida">Dúvidas sobre os serviços</option>
                    <option value="sugestões">Sugestões</option>
                    <option value="reclamações">Reclamações</option>
                    <option value="parcerias">Parcerias</option>
                    <option value="compra">Compra</option>
                    <option value="outros">Outros</option>

                </select>
            </div>

            <div class="mb-7">
                <label for="mensagem" class="form-label">Mensagem</label>
                <input type="text" class="form-control" id="mensagem" placeholder="Digite uma mensagem..." required>
            </div>

             <button type="submit" class="btn btn-warning my-4">Enviar mensagem</button>

        </form>

    </main>
      
    <footer class="text-center p-4 bg-light">
        <p class="mb-1">Desculpas Express</p>
        <p class="mb-0">
            © 2026.
        </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    
</body>

</html>
